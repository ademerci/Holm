# A dev prerelease of the cross-platform rewrite (Windows and Linux), for testing only. Started by pushing a tag
# dev-v<version>.<n> (e.g. dev-v1.13.0.1) on the dev branch. The WPF app's updater asks for the latest release,
# which never is a prerelease, so nobody gets this build without picking it.
name: Dev release

on:
  push:
    tags: ["dev-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        shell: bash
        run: |
          filter="Category!=Local&Category!=Online&Category!=Manual"
          if [ "${{ runner.os }}" != "Windows" ]; then filter="$filter&FullyQualifiedName!~UpdateInstallerTests"; fi
          dotnet test Holm.Tests -c Release --filter "$filter"

      # Self-contained, one file (AGENTS.md); test builds are named Holm-<version>-test-build.<n>, never Holm.exe.
      - name: Publish
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#dev-v}"            # 1.13.0.1
          version="${tag%.*}"; build="${tag##*.}"
          dotnet publish Holm.App -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none -o out
          mkdir release
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            mv out/Holm.App.exe "release/Holm-$version-test-build.$build.exe"
          else
            mv out/Holm.App "release/Holm-$version-test-build.$build-linux-x64"
            chmod +x "release/Holm-$version-test-build.$build-linux-x64"
          fi
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x release/*linux-x64 || true
          gh release create "$GITHUB_REF_NAME" release/* --prerelease --target "$GITHUB_SHA" \
            --title "Holm ${GITHUB_REF_NAME#dev-v} (dev, for testing)" --notes-file docs/cross-platform/DEV-RELEASE.md
