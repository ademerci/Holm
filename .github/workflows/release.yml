# Builds a release on Windows and Linux and publishes it, started by hand (Actions › Release › Run workflow).
# Needs the version in Holm.App.csproj, a CHANGELOG entry and publish/release-<version>-release-notes.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in Holm.App.csproj (e.g. 1.13.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check the version and the notes
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content Holm.App/Holm.App.csproj)
          $version = @($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($version -ne $env:VERSION) { throw "Holm.App.csproj says $version, not $env:VERSION" }
          if (-not (Test-Path "publish/release-$env:VERSION-release-notes.md")) { throw "publish/release-$env:VERSION-release-notes.md is missing" }
          if (git ls-remote --tags origin "v$env:VERSION") { throw "v$env:VERSION exists already" }

      # Local tests need hardware; online and manual tests use external services or user interaction.
      - name: Test
        shell: bash
        run: |
          filter="Category!=Local&Category!=Online&Category!=Manual"
          if [ "${{ runner.os }}" != "Windows" ]; then filter="$filter&FullyQualifiedName!~UpdateInstallerTests"; fi
          dotnet test Holm.Tests -c Release --filter "$filter"

      - name: Self-contained bundle
        shell: pwsh
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }} # built in for GIF search
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GIPHY_API_KEY)) { throw "The GIPHY_API_KEY Actions secret is required for a release." }
          dotnet publish Holm.App -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none -o out/sc
          New-Item -ItemType Directory -Force assets | Out-Null
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item LICENSE pkg/LICENSE
          if ("${{ matrix.rid }}" -eq "win-x64") {
            Copy-Item out/sc/Holm.App.exe assets/Holm.exe
            Copy-Item out/sc/Holm.App.exe pkg/Holm.exe
            Set-Content pkg/README.txt "Holm $env:VERSION for Windows x64`r`n`r`nRun Holm.exe. No .NET installation required.`r`nSee https://github.com/ademerci/Holm for details." -NoNewline
            Compress-Archive -Path pkg/* -DestinationPath "assets/Holm-$env:VERSION-win-x64.zip"
          } else {
            Copy-Item out/sc/Holm.App pkg/Holm
            Set-Content pkg/README.txt "Holm $env:VERSION for Linux x64`n`nRun ./Holm. No .NET installation required.`nSee https://github.com/ademerci/Holm for details." -NoNewline
            tar -czf "assets/Holm-$env:VERSION-linux-x64.tar.gz" -C pkg .
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: assets/

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" assets/* --target "${{ github.sha }}" --title "Holm ${{ inputs.version }}" \
            --notes-file "publish/release-${{ inputs.version }}-release-notes.md" --latest
