# Builds a release on Windows and publishes it, started by hand (Actions › Release › Run workflow).
# Needs the version in WinNotch.csproj, a CHANGELOG entry and publish/release-<version>-release-notes.md on main.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in WinNotch.csproj (e.g. 1.7.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check the version and the notes
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content WinNotch/WinNotch.csproj)
          $version = @($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($version -ne $env:VERSION) { throw "WinNotch.csproj says $version, not $env:VERSION" }
          if (-not (Test-Path "publish/release-$env:VERSION-release-notes.md")) { throw "publish/release-$env:VERSION-release-notes.md is missing" }
          if (git ls-remote --tags origin "v$env:VERSION") { throw "v$env:VERSION exists already" }

      # Local tests need hardware; online and manual tests use external services or user interaction.
      - name: Test
        shell: pwsh
        run: dotnet test WinNotch.Tests -c Release --filter "Category!=Local&Category!=Online&Category!=Manual" -- xUnit.ParallelizeTestCollections=false

      - name: Self-contained zip
        shell: pwsh
        run: |
          dotnet publish WinNotch -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none -p:IncludeNativeLibrariesForSelfExtract=true -o out/sc
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item out/sc/Holm.exe assets/Holm.exe
          # Only Holm.exe, LICENSE and text files: anything else and the updater refuses the archive.
          New-Item -ItemType Directory -Force zip | Out-Null
          Copy-Item out/sc/Holm.exe zip/Holm.exe
          Copy-Item LICENSE zip/LICENSE
          Set-Content zip/README.txt "Holm $env:VERSION for Windows x64`r`n`r`nRun Holm.exe. No .NET installation required.`r`nSee https://github.com/ademerci/Holm for details." -NoNewline
          Compress-Archive -Path zip/* -DestinationPath "assets/Holm-$env:VERSION-win-x64.zip"
          Get-ChildItem assets | Format-Table Name, Length

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" --target $env:GITHUB_SHA --title "Holm $env:VERSION" `
            --notes-file "publish/release-$env:VERSION-release-notes.md" --latest `
            "assets/Holm-$env:VERSION-win-x64.zip" "assets/Holm.exe"
