# Builds a release on Windows and Linux and publishes it, started by hand (Actions › Release › Run workflow).
# Needs the version in Holm.App.csproj, a CHANGELOG entry and publish/release-<version>-release-notes.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in Holm.App.csproj (e.g. 1.13.0)"
        required: true
      island:
        description: "One-word island name for this version series (see AGENTS.md)"
        required: true

permissions:
  contents: write
  actions: write # starts the website build once the release is out

jobs:
  release:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check the version and the notes
        shell: pwsh
        env:
          ISLAND: ${{ inputs.island }}
        run: |
          if ($env:ISLAND -cnotmatch '^\p{L}[\p{L}\p{M}]*\z') { throw "Use a single-word island name." }
          $csproj = [xml](Get-Content Holm.App/Holm.App.csproj)
          $version = @($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($version -ne $env:VERSION) { throw "Holm.App.csproj says $version, not $env:VERSION" }
          $island = @($csproj.Project.PropertyGroup | ForEach-Object { $_.ReleaseIsland } | Where-Object { $_ })[0]
          if ($island -cne $env:ISLAND) { throw "Use the ReleaseIsland from Holm.App.csproj: $island" }
          if (-not (Test-Path "publish/release-$env:VERSION-release-notes.md")) { throw "publish/release-$env:VERSION-release-notes.md is missing" }
          if (git ls-remote --tags origin "v$env:VERSION") { throw "v$env:VERSION exists already" }

      # Local tests need hardware; online and manual tests use external services or user interaction.
      - name: Test
        shell: bash
        run: |
          filter="Category!=Local&Category!=Online&Category!=Manual"
          if [ "${{ runner.os }}" != "Windows" ]; then filter="$filter&FullyQualifiedName!~UpdateInstallerTests"; fi
          dotnet test Holm.Tests -c Release --filter "$filter"

      - name: Self-contained bundle
        shell: pwsh
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }} # built in for GIF search
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GIPHY_API_KEY)) { throw "The GIPHY_API_KEY Actions secret is required for a release." }
          dotnet publish Holm.App -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none -o out/sc
          New-Item -ItemType Directory -Force assets | Out-Null
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item LICENSE pkg/LICENSE
          if ("${{ matrix.rid }}" -eq "win-x64") {
            # Holm 1.12's updater replaces Holm.exe only when the new file's version is exactly the release's (x.y.z.0).
            $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path out/sc/Holm.App.exe).Path)
            $file = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
            if ($file -ne "$env:VERSION.0") { throw "The exe's file version is $file, not $env:VERSION.0: the 1.12 updater would refuse it." }
            if ($info.ProductName -ne "Holm") { throw "The exe's product name is '$($info.ProductName)', not 'Holm': every updater would refuse it." }
            Write-Host "File version $file, as the 1.12 updater expects"
            Copy-Item out/sc/Holm.App.exe assets/Holm.exe
            Copy-Item out/sc/Holm.App.exe pkg/Holm.exe
            Set-Content pkg/README.txt "Holm $env:VERSION for Windows x64`r`n`r`nRun Holm.exe. No .NET installation required.`r`nSee https://github.com/ademerci/Holm for details." -NoNewline
            Compress-Archive -Path pkg/* -DestinationPath "assets/Holm-$env:VERSION-win-x64.zip"
          } else {
            Copy-Item out/sc/Holm.App pkg/Holm
            Set-Content pkg/README.txt "Holm $env:VERSION for Linux x64`n`nRun ./Holm. No .NET installation required.`nSee https://github.com/ademerci/Holm for details." -NoNewline
            tar -czf "assets/Holm-$env:VERSION-linux-x64.tar.gz" -C pkg .
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: assets/

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      # Every release is for Windows and Linux (AGENTS.md): without all three files it is not published.
      - name: Check that both systems are there
        run: |
          for f in Holm.exe "Holm-${{ inputs.version }}-win-x64.zip" "Holm-${{ inputs.version }}-linux-x64.tar.gz"; do
            test -s "assets/$f" || { echo "::error::assets/$f is missing: a release must hold the Windows and the Linux build"; exit 1; }
          done
          ls -l assets

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ISLAND: ${{ inputs.island }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" assets/* --target "${{ github.sha }}" --title "Holm $VERSION — $ISLAND" \
            --notes-file "publish/release-$VERSION-release-notes.md" --latest

      # A release made with this workflow's token doesn't start the Website workflow's "release" trigger (GitHub
      # starts no workflows for events of github.token), so the site is built and deployed here by hand.
      - name: Update the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref main -f deploy=true
